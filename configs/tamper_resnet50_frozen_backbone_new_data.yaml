# ============================================================
# TamperResNet50 config: FROZEN-BACKBONE adaptation on new data
#
# Continues from the 308K-trained model (tamper_resnet50_full_finetune
# _resumed_b96, epoch 6) via model.init_from_checkpoint - that
# checkpoint is only ever READ, never overwritten: every path below is
# a new, distinct file, so the original 308K-trained model stays fully
# intact and usable regardless of what this run does.
#
# The ENTIRE backbone is frozen (freeze_stages: all 5 stages) - only
# the head (fc, 2049 params) trains. This is intentionally the most
# conservative possible adaptation: it can only reweight how the
# already-learned 2048-d features get mapped to a decision, it cannot
# change what features the backbone extracts. Given the new dataset
# (data/raw, normalized: 19,787 authentic + 20,123 tampered, zero
# filename overlap with the 308K training set) showed the model
# catching only ~2.45% of its tampered images beforehand, this
# experiment tests how much of that gap head-only retraining can close
# without touching the backbone at all.
# ============================================================

experiment:
  run_name: "tamper_resnet50_frozen_backbone_new_data"
  seed: 42

data:
  dataset_dir: "/home/user/ml_data/raw_new_normalized"   # 39,910 images: 19,787 authentic / 20,123 tampered
  img_size: 224
  batch_size: 96
  val_ratio: 0.15
  test_ratio: 0.15
  num_workers: 8

  augment: true
  hflip: true
  random_crop: true
  color_jitter: true
  jpeg_recompression: false
  jpeg_quality_range: [30, 90]

model:
  # Read-only reference to the existing 308K-trained checkpoint - never
  # written to by this run.
  init_from_checkpoint: "models/saved/tamper_resnet50_full_finetune_resumed_b96_best.pth"

  # Every stage frozen - only the head is trainable.
  freeze_stages: ["conv1", "layer1", "layer2", "layer3", "layer4"]
  freeze_bn: true
  dropout: 0.5

optim:
  weight_decay: 0.0001
  # Only "head" has trainable params when every stage is frozen.
  lr_groups:
    head: 0.001

loss:
  # 19,787 authentic vs 20,123 tampered (~1.02:1) - balanced, no
  # loss-side bias needed.
  use_pos_weight: false
  pos_weight: 1.0

inference:
  threshold: 0.5

training:
  epochs_cap: 15
  early_stopping_patience: 3
  mixed_precision: true

paths:
  # All new, distinct paths - nothing here can overwrite the 308K
  # model's files (models/saved/tamper_resnet50_full_finetune_resumed_b96_best.pth etc).
  model_save_path: "models/saved/tamper_resnet50_frozen_backbone_new_data_best.pth"
  last_checkpoint_path: "models/checkpoints/tamper_resnet50_frozen_backbone_new_data_last.pth"
  split_save_path: "data/processed/split_tamper_resnet50_frozen_backbone_new_data.json"
  plots_dir: "results/plots/tamper_resnet50_frozen_backbone_new_data"
  experiments_dir: "experiments"
