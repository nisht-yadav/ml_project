# ============================================================
# TamperResNet50 config: layer3 + layer4 UNFROZEN on COMBINED dataset
#
# Follow-up to tamper_resnet50_frozen_backbone_combined (layer4-only
# unfrozen), which early-stopped at epoch 13 with test F1 77.77% -
# slightly WORSE than the head-only attempt it had overwritten
# (F1 79.91%). That result is backed up outside the repo (not in this
# project - see conversation) before being superseded by this run.
#
# This run gives the model more capacity (layer3 now trainable too)
# AND starts from a stronger, more differentiated starting point: the
# 308K-dataset FULLY fine-tuned checkpoint (tamper_resnet50_
# full_finetune_resumed_b96, epoch 6, val_loss 0.3217, freeze_stages: []
# - i.e. every stage including layer3/layer4 was already trained on the
# 308K set alone) rather than continuing from either combined-dataset
# attempt above. That checkpoint is only ever READ here - this run's
# own paths are entirely separate so it is never overwritten.
#
# layer3's LR is kept very low on purpose: its weights already come out
# of a real fine-tuning run (not ImageNet-generic), so large steps here
# risk erasing that - layer4 and head do most of the adapting to the
# combined distribution, layer3 only nudges.
# ============================================================

experiment:
  run_name: "tamper_resnet50_layer3_layer4_combined"
  seed: 42

data:
  dataset_dir: "/home/user/ml_data/combined"   # 348,024 images: 180,511 authentic / 167,513 tampered
  img_size: 224
  batch_size: 96   # proven safe on this 6GB RTX 3050: full_finetune_resumed_b96 (layer1-4 ALL
                    # trainable, strictly more activation memory than this run) already ran clean at 96.
  val_ratio: 0.15
  test_ratio: 0.15
  num_workers: 8

  augment: true
  hflip: true
  random_crop: true
  color_jitter: true
  jpeg_recompression: false
  jpeg_quality_range: [30, 90]

model:
  # 308K-dataset full fine-tune checkpoint (freeze_stages: [] there) -
  # read-only source, never written to by this run.
  init_from_checkpoint: "models/saved/tamper_resnet50_full_finetune_resumed_b96_best.pth"

  # Only conv1/layer1/layer2 frozen now - layer3 and layer4 both trainable.
  freeze_stages: ["conv1", "layer1", "layer2"]
  freeze_bn: false
  dropout: 0.5

optim:
  weight_decay: 0.0001
  # layer3 deliberately very low - protect its already-fine-tuned
  # weights, let layer4 (10x) and head (100x) do most of the adapting.
  lr_groups:
    layer3: 0.00001
    layer4: 0.0001
    head: 0.001

loss:
  # 180,511 authentic vs 167,513 tampered (~1.08:1) - balanced, no
  # loss-side bias needed.
  use_pos_weight: false
  pos_weight: 1.0

inference:
  threshold: 0.5

training:
  epochs_cap: 50
  early_stopping_patience: 3
  mixed_precision: true

paths:
  # All new, distinct paths - the full_finetune_resumed_b96 source
  # checkpoint and the layer4-only combined run (already backed up
  # outside the repo) are only ever READ, never touched by this run.
  model_save_path: "models/saved/tamper_resnet50_layer3_layer4_combined_best.pth"
  last_checkpoint_path: "models/checkpoints/tamper_resnet50_layer3_layer4_combined_last.pth"
  split_save_path: "data/processed/split_tamper_resnet50_layer3_layer4_combined.json"
  plots_dir: "results/plots/tamper_resnet50_layer3_layer4_combined"
  experiments_dir: "experiments"
